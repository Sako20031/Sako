<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квест для Аяулым</title>
<meta name="theme-color" content="#14060d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&family=Marck+Script&display=swap">
<style>
  :root{
    --bg:#14060d;
    --card:rgba(255,236,243,.06);
    --card-strong:rgba(255,236,243,.1);
    --line:rgba(255,190,214,.2);
    --ink:#fff4f7;
    --muted:#d9aebe;
    --rose:#ff5f93;
    --rose-2:#ff9dbd;
    --blush:#ffd4e2;
    --gold:#f4c68d;
    --wine:#7a1238;
    --ok:#7fe0a8;
    --bad:#ff7b7b;
    --radius:22px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(1100px 700px at 80% -10%, rgba(255,95,147,.22), transparent 60%),
      radial-gradient(900px 600px at -10% 30%, rgba(244,198,141,.10), transparent 60%),
      radial-gradient(1000px 800px at 50% 110%, rgba(122,18,56,.5), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100dvh;
  }
  button{font-family:inherit;cursor:pointer;border:0;color:inherit;}
  .script{font-family:'Marck Script',cursive;font-weight:400;}
  .serif{font-family:'Cormorant Garamond',Georgia,serif;}

  /* floating hearts background */
  #sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .float{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;filter:drop-shadow(0 0 8px rgba(255,95,147,.5));}
  @keyframes rise{
    0%{transform:translateY(0) rotate(0);opacity:0;}
    10%{opacity:.55;}
    90%{opacity:.35;}
    100%{transform:translateY(-110vh) rotate(40deg);opacity:0;}
  }

  /* layout */
  .app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));}
  .top{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;}
  .brand{font-family:'Marck Script',cursive;font-size:1.5rem;color:var(--rose-2);}
  .map{display:flex;gap:6px;align-items:center;}
  .map i{width:9px;height:9px;border-radius:50%;background:rgba(255,236,243,.18);transition:.4s;}
  .map i.done{background:var(--rose);box-shadow:0 0 10px var(--rose);}
  .map i.now{background:var(--gold);transform:scale(1.35);box-shadow:0 0 12px var(--gold);}

  .stage{width:100%;max-width:560px;flex:1;display:flex;flex-direction:column;}
  .scene{flex:1;display:flex;flex-direction:column;align-items:center;animation:sceneIn .7s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes sceneIn{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:none;}}

  .loc{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:var(--gold);margin:6px 0 2px;text-align:center;}
  h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;margin:0 0 8px;text-align:center;line-height:1.1;}
  h1{font-size:clamp(2rem,8vw,2.8rem);}
  h2{font-size:clamp(1.6rem,6.5vw,2.2rem);}
  .sub{color:var(--muted);text-align:center;margin:0 0 14px;max-width:440px;}

  /* character + speech bubble */
  .buddy-row{display:flex;flex-direction:column;align-items:center;margin:8px 0 10px;}
  .bubble{position:relative;background:var(--card-strong);border:1px solid var(--line);border-radius:20px;
    padding:14px 18px;max-width:440px;min-height:54px;font-size:1.02rem;text-align:center;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 50px -25px rgba(0,0,0,.8);margin-bottom:14px;}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;transform:translateX(-50%) rotate(45deg);
    background:inherit;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  .bubble b{color:var(--rose-2);}
  .caret{display:inline-block;width:2px;height:1em;background:var(--rose-2);vertical-align:-2px;margin-left:2px;animation:blinkc .8s steps(1) infinite;}
  @keyframes blinkc{50%{opacity:0;}}

  .buddy{width:130px;height:130px;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%;cursor:pointer;}
  .buddy.small{width:84px;height:84px;}
  .buddy.happy{animation:hop .5s ease-in-out 3;}
  .buddy.sad{animation:wobble .5s ease-in-out 2;}
  @keyframes bob{0%,100%{transform:translateY(0) scale(1,1);}50%{transform:translateY(-8px) scale(1.02,.98);}}
  @keyframes hop{0%,100%{transform:translateY(0);}40%{transform:translateY(-26px) scale(.95,1.06);}70%{transform:translateY(0) scale(1.08,.92);}}
  @keyframes wobble{0%,100%{transform:rotate(0);}25%{transform:rotate(-9deg);}75%{transform:rotate(9deg);}}
  .buddy .eye{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1);}95%{transform:scaleY(.1);}}
  .buddy .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 1.6s ease-in-out infinite;}
  @keyframes tail{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(14deg);}}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 30px;border-radius:999px;
    font-weight:800;font-size:1rem;letter-spacing:.02em;color:#fff;
    background:linear-gradient(135deg,var(--rose),#e23a77);box-shadow:0 12px 30px -10px rgba(255,95,147,.8),inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .15s, box-shadow .2s;}
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--blush);}
  .btn.pulse{animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 12px 30px -10px rgba(255,95,147,.8),0 0 0 0 rgba(255,95,147,.5);}50%{box-shadow:0 12px 30px -10px rgba(255,95,147,.8),0 0 0 14px rgba(255,95,147,0);}}
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:auto;padding-top:16px;}

  .card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}

  .slot,.dg,.roll .v{font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;}
  .who{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:4px;}
  .who .btn{padding:22px 10px;font-size:1.25rem;border-radius:20px;flex-direction:column;gap:2px;}
  .who .btn small{font-size:.75rem;font-weight:600;opacity:.8;}
  .flip{animation:backflip .9s cubic-bezier(.4,0,.2,1);}
  @keyframes backflip{0%{transform:translateY(0) rotate(0);}35%{transform:translateY(-70px) rotate(-180deg);}70%{transform:translateY(-20px) rotate(-340deg);}85%{transform:translateY(4px) rotate(-360deg) scale(1.08,.92);}100%{transform:translateY(0) rotate(-360deg);}}
  /* hearts game */
  .field{position:relative;width:100%;height:min(56vh,460px);border-radius:var(--radius);overflow:hidden;
    background:linear-gradient(180deg,rgba(255,95,147,.06),rgba(122,18,56,.25));border:1px solid var(--line);touch-action:manipulation;}
  .fall{position:absolute;top:-60px;font-size:2.4rem;padding:6px;line-height:1;background:none;animation:drop linear forwards;user-select:none;}
  @keyframes drop{to{transform:translateY(calc(min(56vh,460px) + 80px)) rotate(25deg);}}
  .fall.hit{animation:none;transition:transform .25s, opacity .25s;transform:scale(1.8);opacity:0;}
  .bar{width:100%;height:12px;border-radius:99px;background:var(--card);border:1px solid var(--line);overflow:hidden;margin:4px 0 10px;}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .3s;}

  /* voice */
  .play{width:110px;height:110px;border-radius:50%;font-size:2.4rem;margin:4px auto 14px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--rose),#b8255c);box-shadow:0 0 0 0 rgba(255,95,147,.6);}
  .play.on{animation:pulse 1.2s infinite;}
  .opts{display:flex;flex-direction:column;gap:10px;width:100%;}
  .opt{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:1rem;transition:.25s;}
  .opt.yes{background:rgba(127,224,168,.18);border-color:var(--ok);}
  .opt.no{opacity:.35;}

  /* pizza */
  .pizza{position:relative;width:min(70vw,260px);aspect-ratio:1;border-radius:50%;margin:0 auto 14px;
    background:radial-gradient(circle,#ffcf6b 0 52%,#f2a93b 53% 60%,#d9822b 61% 66%,#b8682a 67%);box-shadow:0 20px 40px -15px rgba(0,0,0,.8);transition:filter .6s;}
  .pizza::before,.pizza::after{content:"";position:absolute;left:50%;top:7%;bottom:7%;width:3px;margin-left:-1.5px;background:rgba(140,70,20,.55);border-radius:2px;}
  .pizza::after{transform:rotate(90deg);}
  .pizza .tp{position:absolute;font-size:2.6rem;transform:translate(-50%,-50%);animation:pop .35s;}
  .pizza.bake{animation:spin 1.6s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 30px rgba(255,160,60,.9));}
  @keyframes spin{to{transform:rotate(360deg);}}
  .tops{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;}
  .top-i{padding:12px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.92rem;transition:.2s;}
  .top-i.on{background:rgba(255,95,147,.22);border-color:var(--rose);}
  .coupons{display:flex;flex-direction:column;gap:10px;width:100%;}
  .coupon{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#fff8fa,#ffe1eb);color:#4a0f28;
    border:2px dashed #ff9dbd;animation:sceneIn .5s both;}
  .coupon .e{font-size:2rem;}
  .coupon b{display:block;font-size:1.05rem;}
  .coupon small{color:#9a4a6a;}

  /* scratch card */
  .scratch{position:relative;width:100%;min-height:130px;border-radius:18px;overflow:hidden;margin-top:14px;
    background:linear-gradient(135deg,#fff8fa,#ffe1eb);color:#4a0f28;display:grid;place-items:center;text-align:center;padding:20px;}
  .scratch .gift{font-size:1.25rem;font-weight:800;}
  .scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .6s;}

  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

  /* level 1: digits */
  .slots{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 14px;font-family:'Cormorant Garamond',serif;}
  .slot{width:42px;height:54px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:2rem;font-weight:700;color:var(--blush);transition:.3s;}
  .slot.filled{border-style:solid;border-color:var(--rose);background:rgba(255,95,147,.14);box-shadow:0 0 18px rgba(255,95,147,.35);animation:pop .35s;}
  .slot.next{border-color:var(--gold);}
  .dot{font-size:2rem;color:var(--rose-2);font-weight:700;}
  @keyframes pop{0%{transform:scale(.6);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
  .digits{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;}
  .dg{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid rgba(255,190,214,.12);
    font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--blush);display:grid;place-items:center;
    transition:background .2s, transform .2s, opacity .3s;animation:drift 3s ease-in-out infinite;}
  .dg:active{transform:scale(.9);}
  .dg.used{opacity:.12;pointer-events:none;background:transparent;}
  .dg.wrong{background:rgba(255,123,123,.25);border-color:var(--bad);}
  @keyframes drift{0%,100%{translate:0 0;}50%{translate:0 -3px;}}

  /* level 2: cafe */
  .cafes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;}
  .cafe{padding:18px 10px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center;transition:.25s;}
  .cafe .e{font-size:2.2rem;display:block;margin-bottom:4px;}
  .cafe .n{font-weight:800;}
  .cafe .d{display:block;font-size:.8rem;color:var(--muted);}
  .cafe:hover{background:var(--card-strong);transform:translateY(-2px);}
  .cafe.no{opacity:.35;filter:grayscale(1);}
  .cafe.yes{background:linear-gradient(135deg,rgba(255,95,147,.35),rgba(244,198,141,.25));border-color:var(--rose);box-shadow:0 0 30px rgba(255,95,147,.45);transform:scale(1.04);}

  /* level 3: memory */
  .mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;perspective:800px;}
  .mc{aspect-ratio:3/4;position:relative;background:none;padding:0;}
  .mc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d;}
  .mc.open .in,.mc.got .in{transform:rotateY(180deg);}
  .mc .f,.mc .b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .mc .f{background:linear-gradient(135deg,#5a0f2c,#2a0a18);border:1px solid var(--line);font-size:1.3rem;color:var(--rose-2);}
  .mc .b{background:var(--card-strong);border:1px solid var(--rose);transform:rotateY(180deg);font-size:2rem;}
  .mc.got .b{background:rgba(127,224,168,.16);border-color:var(--ok);}
  .stat{color:var(--muted);font-size:.9rem;margin-top:10px;text-align:center;}

  /* level 4: scramble */
  .word{display:flex;gap:6px;justify-content:center;margin:6px 0 18px;flex-wrap:wrap;}
  .ws{width:44px;height:54px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:1.6rem;font-weight:800;background:none;color:var(--ink);}
  .ws.filled{border-style:solid;border-color:var(--rose);background:rgba(255,95,147,.14);}
  .word.ok .ws{border-color:var(--ok);background:rgba(127,224,168,.18);animation:pop .4s;}
  .letters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .lt{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--rose),#b8255c);font-size:1.5rem;font-weight:800;color:#fff;box-shadow:0 8px 18px -8px rgba(255,95,147,.9);transition:.2s;}
  .lt.gone{opacity:0;transform:scale(.4);pointer-events:none;}

  /* level 5: photo puzzle */
  .puz{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%;max-width:360px;aspect-ratio:1;border-radius:18px;overflow:hidden;
    border:1px solid var(--line);background:rgba(0,0,0,.3);}
  .pt{background-size:300% 300%;padding:0;transition:outline .15s, filter .2s;}
  .pt.sel{outline:3px solid var(--gold);outline-offset:-3px;filter:brightness(1.2);}
  .puz.solved{gap:0;box-shadow:0 0 50px rgba(255,95,147,.55);animation:pop .6s;}
  .polaroid{background:#fff8fa;padding:12px 12px 16px;border-radius:6px;transform:rotate(-2deg);box-shadow:0 30px 60px -20px rgba(0,0,0,.8);max-width:340px;width:100%;}
  .polaroid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px;display:block;}
  .polaroid p{margin:10px 0 0;font-family:'Marck Script',cursive;color:#7a1238;font-size:1.4rem;text-align:center;}

  /* level 6: lock */
  .lock{display:flex;align-items:center;justify-content:center;gap:4px;margin:6px 0 10px;}
  .roll{display:flex;flex-direction:column;align-items:center;}
  .roll button{background:none;color:var(--rose-2);font-size:1.1rem;padding:6px 10px;}
  .roll .v{width:42px;height:56px;border-radius:12px;background:linear-gradient(180deg,#2a0a18,#4a0f28 50%,#2a0a18);border:1px solid var(--line);
    display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:2.1rem;font-weight:700;}
  .lock.ok .v{border-color:var(--ok);color:var(--ok);}

  /* final */
  .letter{background:linear-gradient(180deg,#fff8fa,#ffe9f0);color:#4a0f28;border-radius:18px;padding:22px 20px;box-shadow:0 30px 70px -25px rgba(0,0,0,.9);
    font-size:1.05rem;line-height:1.65;transform:rotate(-.6deg);}
  .letter .script{font-size:1.7rem;color:#c2185b;}
  .letter p{margin:0 0 10px;}
  .sign{text-align:right;font-family:'Marck Script',cursive;font-size:1.5rem;color:#c2185b;}

  /* paw transition */
  #walk{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .35s;
    background:radial-gradient(circle at 50% 50%, rgba(40,8,22,.88), rgba(20,6,13,.97));}
  #walk.on{opacity:1;pointer-events:auto;}
  .paw{position:absolute;width:38px;height:38px;opacity:0;animation:step 1.9s ease-out forwards;}
  @keyframes step{0%{opacity:0;transform:var(--r) scale(.4);}12%{opacity:1;transform:var(--r) scale(1.1);}22%{transform:var(--r) scale(1);}75%{opacity:.9;}100%{opacity:0;transform:var(--r) scale(1);}}
  #walk .walker{position:absolute;bottom:14%;left:-120px;width:96px;animation:walkby 2.2s linear forwards;}
  @keyframes walkby{to{left:calc(100% + 40px);}}
  #walk .walker svg{animation:waddle .28s ease-in-out infinite alternate;}
  @keyframes waddle{from{transform:rotate(-6deg) translateY(0);}to{transform:rotate(6deg) translateY(-6px);}}
  #walk .wtitle{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:'Marck Script',cursive;font-size:2.1rem;color:var(--blush);
    opacity:0;animation:fadeT 2.1s ease forwards;}
  @keyframes fadeT{0%{opacity:0;transform:translateY(10px);}25%,75%{opacity:1;transform:none;}100%{opacity:0;}}

  /* confetti */
  .conf{position:fixed;top:-30px;z-index:60;pointer-events:none;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--card-strong);border:1px solid var(--line);
    padding:10px 16px;border-radius:999px;backdrop-filter:blur(10px);font-weight:700;animation:sceneIn .3s;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div class="app">
  <div class="top">
    <div class="brand">для Аяулым ♡</div>
    <div class="map" id="map" aria-label="Прогресс квеста"></div>
  </div>
  <main class="stage" id="stage"></main>
</div>
<div id="walk" aria-hidden="true"></div>

<script>
/* ============================================================
   НАСТРОЙКИ КВЕСТА — меняй здесь
   ============================================================ */
const CONFIG = {
  her: 'Аяулым',
  me: 'Сагынжан',
  buddyName: 'Мими',
  firstDate: '251125',                 // 25.11.25 — первая официальная дата
  cafeAnswer: 'bisi',
  // Фото: положи файл в public/quest-files/ и укажи путь. Пока файла нет — будет заглушка.
  photo: '/quest-files/first.jpg',
  photoCaption: '11.09.2025 — наше первое фото ♡',
  hospitalPhoto: '/quest-files/hospital.jpg',
  // Дата «больницы» в формате ДДММГГ, например '140226'. null — пока не задана (принимается любая).
  hospitalDate: '140925',              // 14.09.25
  // «Что я сказал?» — голосовое. null — пока без записи: фраза показывается текстом задом наперёд.
  voice: null,                         // например '/quest-files/voice.mp3'
  voiceMode: 'reverse',                // 'reverse' — задом наперёд, 'fast' — ускорено
  voiceAnswer: 'Ты моё самое красивое чудо', // что сказано на самом деле
  voiceWrong: ['Ты моё самое любимое солнце', 'Ты моя самая красивая звёздочка'],
  // Подсказка, где лежит подарок в реальной жизни (открывается в финале стиралкой)
  giftHint: 'Вечером подарок будет лежать в твоей сумке 👜',
};

/* ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const stage = $('#stage');
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },

/* ---------- утилиты ---------- */
let typeTimer = null;
function say(text, el = $('#bubble')){
  if (!el) return Promise.resolve();
  clearInterval(typeTimer);
  return new Promise(res => {
    let i = 0; const plain = text;
    el.innerHTML = '<span class="caret"></span>';
    const finish = () => { clearInterval(typeTimer); el.innerHTML = plain; el.onclick = null; res(); };
    el.onclick = finish;
    typeTimer = setInterval(() => {
      i++;
      // не разрезаем html-теги посередине
      while (plain[i-1] === '<'){ const j = plain.indexOf('>', i); i = j + 1; }
      el.innerHTML = plain.slice(0, i) + '<span class="caret"></span>';
      if (i >= plain.length) finish();
    }, 28);
  });
}
function mood(cls){
  const b = $('.buddy'); if (!b) return;
  b.classList.remove('happy','sad'); void b.offsetWidth; b.classList.add(cls);
  setTimeout(() => b.classList.remove(cls), 1600);
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
function shuffle(a){ for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function confetti(n = 70){
  const items = ['💖','💗','✨','🌸','💕','⭐','🐾'];
  for (let i = 0; i < n; i++){
    const c = document.createElement('div'); c.className = 'conf';
    c.textContent = items[i % items.length];
    c.style.left = Math.random()*100 + 'vw';
    c.style.fontSize = (14 + Math.random()*18) + 'px';
    c.style.animationDuration = (2.2 + Math.random()*2.5) + 's';
    c.style.animationDelay = (Math.random()*.6) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}
function buddyBlock(text, small){
  return `<div class="buddy-row">
    <div class="bubble" id="bubble">${text ? '' : ''}</div>
    <div class="buddy ${small ? 'small' : ''}" id="buddy" title="${CONFIG.buddyName}">${buddySVG()}</div>
  </div>`;
}

/* ---------- переход между локациями: лапки ---------- */
function walkTo(title){
  return new Promise(res => {
    const w = $('#walk'); w.innerHTML = '';
    const W = innerWidth, H = innerHeight, steps = 9;
    for (let i = 0; i < steps; i++){
      const p = document.createElement('div'); p.className = 'paw'; p.innerHTML = PAW;
      const t = i / (steps-1);
      const x = W*0.08 + t*(W*0.84) + (i % 2 ? 14 : -14);
      const y = H*0.82 - t*(H*0.62) + (i % 2 ? 10 : -10);
      const ang = Math.atan2(-H*0.62, W*0.84) * 180/Math.PI + 90;
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.setProperty('--r', `rotate(${ang}deg)`);
      p.style.animationDelay = (i * 0.14) + 's';
      w.appendChild(p);
    }
    const walker = document.createElement('div'); walker.className = 'walker'; walker.innerHTML = buddySVG();
    w.appendChild(walker);
    if (title){ const t = document.createElement('div'); t.className = 'wtitle'; t.textContent = title; w.appendChild(t); }
    w.classList.add('on');
    setTimeout(res, 1700);
    setTimeout(() => w.classList.remove('on'), 2300);
    setTimeout(() => { w.innerHTML = ''; }, 2700);
  });
}

  $('#map').innerHTML = LEVELS.slice(2).map((l, i) => {
    const idx = i + 2;
    return `<i class="${idx < cur ? 'done' : idx === cur ? 'now' : ''}" title="${locTitle(idx)}"></i>`;
  }).join('');
}
async function go(i, withWalk = true){

  cur = i; store.set('quest.level', String(i)); renderMap();
  window.scrollTo({ top:0 });
  SCENES[LEVELS[i].id]();
}

    stage.innerHTML = `<section class="scene">
      <div class="loc">Локация ${cur - 1}</div>
      <h2>Собери фото</h2>
      ${buddyBlock(true, true)}
      <div class="puz" id="puz"></div>
      <p class="stat">Нажми на два кусочка, чтобы поменять их местами</p>
    </section>`;
    say('Тут спрятано одно особенное фото 📸 Собери пазл и посмотри, что получится!');
    loadPhoto(src => {
      const order = (() => { let o; do { o = shuffle([...Array(9).keys()]); } while (o.every((v, i) => v === i)); return o; })();
      const puz = $('#puz');
      const draw = () => {
        puz.innerHTML = order.map((p, i) => {
          const x = (p % 3) * 50, y = Math.floor(p / 3) * 50;
          return `<button class="pt" data-i="${i}" style="background-image:url('${src}');background-position:${x}% ${y}%"></button>`;
        }).join('');
      };
      draw();
      let sel = null;
      puz.onclick = e => {
        const t = e.target.closest('.pt'); if (!t || puz.classList.contains('solved')) return;
        const i = +t.dataset.i;
        if (sel === null){ sel = i; t.classList.add('sel'); buzz(10); return; }
        [order[sel], order[i]] = [order[i], order[sel]]; sel = null; draw(); buzz(10);
        if (order.every((v, k) => v === k)){
          puz.classList.add('solved'); mood('happy'); confetti(60);
          setTimeout(() => {
            stage.querySelector('.scene .stat').remove();
            puz.outerHTML = `<div class="polaroid"><img src="${src}" alt="Наше первое совместное фото"><p>${CONFIG.photoCaption}</p></div>`;
            say('Наше <b>первое совместное фото</b>, 11 сентября 2025 🥹 Помнишь этот день?').then(() => {
              stage.querySelector('.scene').insertAdjacentHTML('beforeend', `<div class="actions"><button class="btn" id="nx">Дальше 🐾</button></div>`);
              $('#nx').onclick = next;
            });
          }, 900);
        }
      };
    });
  },

  hospital(){
    const vals = [0,0,0,0,0,0];
    stage.innerHTML = `<section class="scene">
      <div class="loc">Локация ${cur - 1}</div>
      <h2>Тот самый день</h2>
      ${buddyBlock(true, true)}
      <div class="lock" id="lock">${vals.map((v, i) => `
        <div class="roll"><button data-i="${i}" data-d="1" aria-label="больше">▲</button><div class="v" id="v${i}">0</div><button data-i="${i}" data-d="-1" aria-label="меньше">▼</button></div>
        ${i === 1 || i === 3 ? '<span class="dot">.</span>' : ''}`).join('')}</div>
      <div class="actions"><button class="btn" id="open">Открыть 🔓</button></div>
    </section>`;
    say('Помнишь день, когда ты попала в больницу? 🏥 Было тревожно, но я был рядом с тобой. Введи эту <b>дату</b> — она откроет замочек.');
    $('#lock').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const i = +b.dataset.i; vals[i] = (vals[i] + +b.dataset.d + 10) % 10;
      $('#v' + i).textContent = vals[i]; buzz(8);
    };
    $('#open').onclick = () => {
      const entered = vals.join('');
      if (!CONFIG.hospitalDate || entered === CONFIG.hospitalDate){
        $('#lock').classList.add('ok'); mood('happy'); confetti(40);
        $('#lock').outerHTML = `<div class="polaroid" style="transform:rotate(1.5deg)"><img src="${CONFIG.hospitalPhoto}" alt="Мы в больнице"><p>14.09.2025 — я рядом ♡</p></div>`;
        $('#open').parentElement.innerHTML = '<button class="btn" id="nx">Дальше 🐾</button>';
        $('#nx').onclick = next;
        say('<b>14.09.2025</b> 💗 Даже в больнице ты улыбалась. Самые трудные дни показывают, как сильно мы дорожим друг другом.');
      } else {
        shake($('#lock')); mood('sad'); buzz([30,40,30]);
        say('Не та дата… попробуй ещё 🥺 Формат: <b>ДД.ММ.ГГ</b>');
      }
    };
  },

  voice(){
    const opts = shuffle([CONFIG.voiceAnswer, ...CONFIG.voiceWrong]);
    stage.innerHTML = `<section class="scene">
      <div class="loc">Локация ${cur - 1}</div>
      <h2>Что я сказал?</h2>
      ${buddyBlock(true, true)}
      ${CONFIG.voice ? '<button class="play" id="play" aria-label="Послушать">▶</button>'
        : `<div class="card" id="rev" style="text-align:center;font-size:1.5rem;font-weight:800;letter-spacing:.04em;margin-bottom:14px;color:var(--blush)">«${[...CONFIG.voiceAnswer].reverse().join('')}»</div>`}
      <div class="opts" id="opts">${opts.map(o => `<button class="opt">${o}</button>`).join('')}</div>
    </section>`;
    say(!CONFIG.voice
      ? `${CONFIG.me} хотел сказать тебе кое-что важное, а я перевернул его слова <b>задом наперёд</b> 🙃 Прочитай и угадай!`
      : CONFIG.voiceMode === 'fast'
      ? `${CONFIG.me} записал тебе голосовое, но я его <b>ускорил</b> 🐿️ Послушай и угадай, что он сказал!`
      : `${CONFIG.me} записал тебе голосовое, а я его прокрутил <b>задом наперёд</b> 🙃 Угадай, что он сказал!`);
    let ctx, buf, normal = false, src;
    const load = async () => {
      if (buf) return;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const raw = await (await fetch(CONFIG.voice)).arrayBuffer();
      buf = await new Promise((ok, no) => ctx.decodeAudioData(raw, ok, no));
    };
    const play = async () => {
      try {
        await load(); if (ctx.state === 'suspended') await ctx.resume();
        if (src) try { src.stop(); } catch(e){}
        let b = buf;
        if (!normal && CONFIG.voiceMode !== 'fast'){
          b = ctx.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
          for (let c = 0; c < buf.numberOfChannels; c++) b.getChannelData(c).set(Array.from(buf.getChannelData(c)).reverse());
        }
        src = ctx.createBufferSource(); src.buffer = b;
        if (!normal && CONFIG.voiceMode === 'fast') src.playbackRate.value = 1.9;
        src.connect(ctx.destination);
        $('#play').classList.add('on'); src.onended = () => $('#play') && $('#play').classList.remove('on');
        src.start();
      } catch(e){ say('Ой, не получилось включить звук 🙈 Попробуй ещё раз'); }
    };
    if (CONFIG.voice) $('#play').onclick = play;
    $('#opts').onclick = e => {
      const o = e.target.closest('.opt'); if (!o || o.classList.contains('no') || normal) return;
      if (o.textContent === CONFIG.voiceAnswer){
        normal = true; o.classList.add('yes'); mood('happy'); confetti(50);
        document.querySelectorAll('.opt').forEach(x => x !== o && x.classList.add('no'));
        if (!CONFIG.voice) $('#rev').textContent = `«${CONFIG.voiceAnswer}» 💗`;
        say(CONFIG.voice ? 'Правильно! 💗 Нажми ▶ — теперь послушай <b>по-нормальному</b>'
          : `Правильно! Ты — его <b>самое красивое чудо</b> 💗`).then(() => {
          stage.querySelector('.scene').insertAdjacentHTML('beforeend', `<div class="actions"><button class="btn" id="nx">Дальше 🐾</button></div>`);
          $('#nx').onclick = () => { if (src) try { src.stop(); } catch(e){} next(); };
        });
      } else { o.classList.add('no'); shake(o); mood('sad'); buzz([30,40,30]); say(CONFIG.voice ? 'Не-а 🙈 Послушай ещё раз!' : 'Не-а 🙈 Прочитай ещё раз, справа налево!'); }
    };
  },

  pizza(){
    const TOPS = [
      ['🤗','Обнимашки'], ['🍫','Шоколадка'], ['🎬','Вечер кино'], ['💆‍♀️','Массаж'],
      ['🥟','Поход в Биси'], ['🌹','Цветы'], ['🍳','Завтрак от меня'], ['🚗','Покатушки'],
    ];
    const max = 4, pick = [];
    const spots = [[66,34],[66,66],[34,66],[34,34]]; // по одному желанию на каждый кусочек
    stage.innerHTML = `<section class="scene">
      <div class="loc">Локация ${cur - 1}</div>
      <h2>Пицца желаний</h2>
      ${buddyBlock(true, true)}
      <div class="pizza" id="pizza"></div>
      <div class="tops" id="tops">${TOPS.map(([e, n], i) => `<button class="top-i" data-i="${i}">${e} ${n}</button>`).join('')}</div>
      <div class="actions"><button class="btn" id="bake" disabled style="opacity:.5">В печь 🔥</button></div>
    </section>`;
    say(`Собери пиццу из <b>${max} желаний</b> 🍕 Каждое станет купоном, который ${CONFIG.me} обязан выполнить!`);
    const draw = () => {
      $('#pizza').innerHTML = pick.map((i, k) => `<span class="tp" style="left:${spots[k][0]}%;top:${spots[k][1]}%">${TOPS[i][0]}</span>`).join('');
      document.querySelectorAll('.top-i').forEach(b => b.classList.toggle('on', pick.includes(+b.dataset.i)));
      const ready = pick.length === max; $('#bake').disabled = !ready; $('#bake').style.opacity = ready ? 1 : .5;
      if (ready) $('#bake').classList.add('pulse'); else $('#bake').classList.remove('pulse');
    };
    $('#tops').onclick = e => {
      const b = e.target.closest('.top-i'); if (!b) return;
      const i = +b.dataset.i, at = pick.indexOf(i);
      if (at >= 0) pick.splice(at, 1);
      else if (pick.length < max) pick.push(i);
      else { shake($('#pizza')); return say(`Только ${max} желания на одну пиццу 😋 Убери какое-нибудь`); }
      buzz(10); draw();
    };
    $('#bake').onclick = () => {
      $('#bake').parentElement.remove(); $('#tops').remove();
      $('#pizza').classList.add('bake'); say('Пеку-пеку… 🔥');
      setTimeout(() => {
        mood('happy'); confetti(50);
        $('#pizza').insertAdjacentHTML('afterend', `<div class="coupons">${pick.map(i => `
          <div class="coupon"><span class="e">${TOPS[i][0]}</span><div><b>Купон: ${TOPS[i][1]}</b><small>Выдал: ${CONFIG.me} · срок: бессрочно ♡</small></div></div>`).join('')}</div>
          <div class="actions"><button class="btn" id="nx">Дальше 🐾</button></div>`);
        $('#pizza').style.width = 'min(40vw,150px)';
        say('Готово! Сделай <b>скриншот</b> купонов и предъяви их ' + CONFIG.me + 'у 😎');
        $('#nx').onclick = next;
      }, 1700);
    };
  },

  final(){
    stage.innerHTML = `<section class="scene">
      <div class="loc">квест пройден</div>
      <h1>Ты умница, <span class="script" style="color:var(--rose-2)">жаным</span>!</h1>
      ${buddyBlock(true)}
      <div class="letter" id="letter" hidden>
        <p class="script">Моя ${CONFIG.her},</p>
        <p>спасибо, что ты прошла этот маленький путь вместе с ${CONFIG.buddyName}. Каждая локация здесь — кусочек нашей истории: первая дата, наши Биси, наше первое фото, и даже больница, через которую мы прошли вместе. А купоны из пиццы — не шутка, я всё выполню 😌</p>
        <p>Я очень тебя люблю. И это только начало — впереди ещё много наших локаций 💖</p>
        <div class="sign">твой ${CONFIG.me}</div>
      </div>
      <div class="scratch" id="scratch" hidden>
        <div><div style="font-size:2rem">🎁</div><div class="gift">${CONFIG.giftHint || 'Подарок уже ждёт тебя… спроси у ' + CONFIG.me + 'а 😉'}</div></div>
        <canvas id="scr"></canvas>
      </div>
      <div class="actions"><button class="btn ghost" id="again">Пройти ещё раз ↺</button></div>
    </section>`;
    confetti(110); mood('happy');
    say(`Ура-а-а! Ты прошла все локации 🎉 А вот письмо от <b>${CONFIG.me}а</b>…`)
      .then(() => {
        $('#letter').hidden = false; $('#letter').style.animation = 'sceneIn .7s both';
        setTimeout(() => { $('#scratch').hidden = false; $('#scratch').style.animation = 'sceneIn .7s both'; scratchCard(); }, 1200);
      });
    $('#buddy').onclick = () => { mood('happy'); confetti(25); };
    $('#again').onclick = () => { store.set('quest.level', '0'); go(0, false); };
  },
};

/* ---------- стиралка: открывает подсказку, где лежит подарок ---------- */
function scratchCard(){
  const cv = $('#scr'), box = $('#scratch'), r = box.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const grad = g.createLinearGradient(0, 0, r.width, r.height);
  grad.addColorStop(0, '#ff5f93'); grad.addColorStop(1, '#b8255c');
  g.fillStyle = grad; g.fillRect(0, 0, r.width, r.height);
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = '700 18px Manrope, sans-serif';
  g.fillText('✨ Сотри пальцем — тут сюрприз ✨', r.width / 2, r.height / 2 + 6);
  g.globalCompositeOperation = 'destination-out';
  let down = false, doneS = false, n = 0;
  const rub = e => {
    if (!down || doneS) return;
    const b = cv.getBoundingClientRect();
    g.beginPath(); g.arc(e.clientX - b.left, e.clientY - b.top, 22, 0, Math.PI * 2); g.fill();
    if (++n % 12) return;
    const d = g.getImageData(0, 0, cv.width, cv.height).data; let clear = 0;
    for (let i = 3; i < d.length; i += 64) if (d[i] === 0) clear++;
    if (clear / (d.length / 64) > .5){ doneS = true; cv.style.opacity = 0; setTimeout(() => cv.remove(), 600); confetti(80); mood('happy'); buzz([40,60,40]); }
  };
  cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); rub(e); };
  cv.onpointermove = rub;
  cv.onpointerup = cv.onpointercancel = () => { down = false; };
}

/* ---------- фото: реальное или красивая заглушка ---------- */
function loadPhoto(cb){
  const img = new Image();
  img.onload = () => {
    // квадратный кроп через canvas, чтобы пазл не растягивал фото
    try {
      const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas');
      c.width = c.height = Math.min(s, 900);
      c.getContext('2d').drawImage(img, (img.naturalWidth - s)/2, (img.naturalHeight - s)/2, s, s, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', .9));
    } catch(e){ cb(CONFIG.photo); }
  };
  img.onerror = () => cb(placeholderPhoto());
  img.src = CONFIG.photo;
}
function placeholderPhoto(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9dbd"/><stop offset=".5" stop-color="#c2185b"/><stop offset="1" stop-color="#4a0f28"/></linearGradient></defs>
    <rect width="600" height="600" fill="url(#g)"/>
    <circle cx="120" cy="110" r="60" fill="#ffd4e2" opacity=".35"/><circle cx="500" cy="480" r="90" fill="#f4c68d" opacity=".25"/>
    <text x="300" y="250" font-size="150" text-anchor="middle">💑</text>
    <text x="300" y="400" font-size="110" text-anchor="middle">🐾</text>
    <text x="300" y="520" font-size="40" fill="#fff" text-anchor="middle" font-family="Georgia,serif" font-style="italic">тут будет наше фото</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ---------- старт ---------- */
const saved = parseInt(store.get('quest.level') || '0', 10);
const startAt = Number.isFinite(saved) && saved > 1 && saved < LEVELS.length ? saved : 0;
if (location.hash === '#restart') store.set('quest.level', '0');
go(location.hash === '#restart' ? 0 : startAt, false);
</script>
